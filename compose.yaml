name: tooloc

services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: sh -c "composer install --no-interaction --no-progress && php -S 0.0.0.0:8000 -t public"
    ports:
      - "${HTTP_PORT:-8000}:8000"
    volumes:
      - ./:/app
    environment:
      DATABASE_URL: "postgresql://tooloc:tooloc@database:5432/tooloc?serverVersion=18&charset=utf8"
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: tooloc
      POSTGRES_USER: tooloc
      POSTGRES_PASSWORD: tooloc
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tooloc", "-d", "tooloc"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - database_data:/var/lib/postgresql

volumes:
  database_data:
